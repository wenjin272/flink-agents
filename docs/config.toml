baseURL = '//nightlies.apache.org/flink/flink-agents-docs-main'
languageCode = "en-us"
title = "Apache Flink Agents"
enableGitInfo = false
theme = "book"
pygmentsUseClasses = true

[params]
  # Flag whether this is a stable version or not.
  # Used for the quickstart page.
  IsStable = false

  # Flag to indicate whether an outdated warning should be shown.
  ShowOutDatedWarning = false

  # Keep Flink Agents versions centralized here and use shortcodes in the docs.
  # Source/artifact version for this branch, also used by the page version label.
  # Updated by the release/version-update scripts; exposed by the version shortcode.
  Version = "1.0-SNAPSHOT"

  # Published release used by installation instructions and Maven examples.
  # Update after publication, independently of the branch's development version.
  # Exposed by the stable_version shortcode.
  StableVersion = "0.4.0"

  # For stable releases, leave the bugfix version out (e.g. 1.2). For snapshot
  # release this should be the same as the regular version
  VersionTitle = "1.0-SNAPSHOT"

  # The branch for this version of Apache Flink Agents
  Branch = "main"

  # The github repository for Apache Flink Agents
  Repo = "//github.com/apache/flink-agents"

  GithubRepo = "https://github.com/apache/flink-agents.git"

  ProjectHomepage = "//flink.apache.org"

  # External links at the bottom
  # of the menu
  MenuLinks = [
    ["Project Homepage", "//flink.apache.org"],
  ]

  PreviousDocs = [
    ["0.4", "http://nightlies.apache.org/flink/flink-agents-docs-release-0.4"],
    ["0.3", "http://nightlies.apache.org/flink/flink-agents-docs-release-0.3"],
    ["0.2", "http://nightlies.apache.org/flink/flink-agents-docs-release-0.2"],
    ["0.1", "http://nightlies.apache.org/flink/flink-agents-docs-release-0.1"],
  ]

[markup]
[markup.goldmark.renderer]
  unsafe = true
[markup.tableOfContents]
  startLevel = 1

[languages]
[languages.en]
  languageName = 'English'
  contentDir = 'content'
  weight = 1

# TODO: Add Chinese support
# [languages.zh]
#   languageName = '中文版'
#   contentDir = 'content.zh'
#   weight = 2

[module]
[[module.imports.mounts]]
  source = 'content'
  target = 'content'
  lang = 'en'
[[module.imports.mounts]]
  source = 'content.zh'
  target = 'content'
  lang = 'zh'
[[module.imports.mounts]]
  source = 'layouts'
  target = 'layouts'
[[module.imports.mounts]]
  source = 'data'
  target = 'data'
