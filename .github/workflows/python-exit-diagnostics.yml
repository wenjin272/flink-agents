name: Python exit diagnostics

on:
  push:
    branches: [codex/ci-python-exit-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: exit diagnostics [${{ matrix.mode }}] [flink-${{ matrix.flink }}] [sample-${{ matrix.sample }}]
    if: github.repository == 'wenjin272/flink-agents'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flink: ['1.20']
        mode: [raw, wrapper]
        sample: [1, 2, 3]
    env:
      SKIP_SPOTLESS_CHECK: 'true'
      CI_EXIT_LOG_DIR: ${{ github.workspace }}/output/ci-exit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.0/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build exact source and Python environment
        run: |
          mkdir -p "$CI_EXIT_LOG_DIR"
          bash tools/build.sh 2>&1 | tee "$CI_EXIT_LOG_DIR/build.log"
      - name: Install Ollama
        run: bash tools/start_ollama_server.sh
      - name: Prepare all test models
        timeout-minutes: 20
        run: |
          mkdir -p "$CI_EXIT_LOG_DIR"
          for model in qwen3.5:2b qwen3:1.7b nomic-embed-text:latest all-minilm:22m; do
            model_log="$CI_EXIT_LOG_DIR/pull-${model//:/_}.log"
            ready=false
            for attempt in 1 2 3; do
              echo "Preparing $model (attempt $attempt/3)"
              echo "Attempt $attempt/3" >> "$model_log"
              if timeout 300 ollama pull "$model" >> "$model_log" 2>&1; then
                ready=true
                break
              fi
              tail -n 5 "$model_log"
            done
            if [ "$ready" != true ]; then
              echo "Model preparation failed: $model" >&2
              exit 1
            fi
            ollama show "$model" > "$CI_EXIT_LOG_DIR/model-${model//:/_}.txt"
            # Confirm the same pull used during collection now fits its 120s limit.
            timeout 90 bash python/flink_agents/e2e_tests/scripts/ollama_pull_model.sh "$model" >> "$model_log" 2>&1
          done
          ollama list | tee "$CI_EXIT_LOG_DIR/models.txt"
      - name: Reproduce Python IT exit
        id: python_it
        timeout-minutes: 30
        run: |
          export PYTHONPATH="$(python/.venv/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          # Both modes keep the same shell logging and environment. Only the
          # wrapper opt-in differs; raw uses the original pytest entry point.
          unset PYTHON_EXIT_DIAGNOSTICS_DIR
          if [ '${{ matrix.mode }}' = wrapper ]; then
            export PYTHON_EXIT_DIAGNOSTICS_DIR="$CI_EXIT_LOG_DIR"
          fi
          echo 'mode=${{ matrix.mode }}' | tee "$CI_EXIT_LOG_DIR/mode.txt"
          # Match the public fork PR run: no external model API key is injected.
          set +e
          tools/ut.sh -p -e -f '${{ matrix.flink }}' 2>&1 | tee "$CI_EXIT_LOG_DIR/console.log"
          codes=("${PIPESTATUS[@]}")
          echo "ut.sh exit=${codes[0]}, tee exit=${codes[1]}" | tee "$CI_EXIT_LOG_DIR/shell-exit.txt"
          if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
          exit "${codes[1]}"
      - name: Validate full test coverage
        if: always() && steps.python_it.outcome != 'skipped'
        run: python tools/ci/check_python_exit_coverage.py "$CI_EXIT_LOG_DIR"
      - name: Record environment
        if: always()
        run: |
          mkdir -p "$CI_EXIT_LOG_DIR"
          {
            git rev-parse HEAD
            uname -a
            java -version
            mvn -version
            uv --version
            ollama --version
            python/.venv/bin/python --version
            uv pip freeze --python python/.venv/bin/python
          } > "$CI_EXIT_LOG_DIR/environment.txt" 2>&1
          if [ -f python/uv.lock ]; then cp python/uv.lock "$CI_EXIT_LOG_DIR/uv.lock"; fi
          for crash_log in python/hs_err_pid*.log; do
            if [ -f "$crash_log" ]; then cp "$crash_log" "$CI_EXIT_LOG_DIR/"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-exit-${{ matrix.mode }}-${{ matrix.flink }}-${{ matrix.sample }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-exit/
          retention-days: 7
          if-no-files-found: error
