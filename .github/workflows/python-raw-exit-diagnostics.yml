name: Python raw exit diagnostics

on:
  push:
    branches: [codex/ci-python-raw-1339]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: raw exit [flink-1.20] [sample-${{ matrix.sample }}]
    if: github.repository == 'wenjin272/flink-agents'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    env:
      SKIP_SPOTLESS_CHECK: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.11.0/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install flink-agents
        run: bash tools/build.sh
      - name: Install Ollama
        run: bash tools/start_ollama_server.sh
      - name: Run Python IT
        env:
          ACTION_API_KEY: ''
        run: |
          export PYTHONPATH="$(python/.venv/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          set +e
          tools/ut.sh -p -e -f 1.20
          raw_exit=$?
          echo "ut.sh exit=$raw_exit"
          exit "$raw_exit"
      - name: Record environment after test exit
        if: always()
        run: |
          mkdir -p output/ci-raw-exit
          {
            git rev-parse HEAD
            uname -a
            java -version
            mvn -version
            uv --version
            ollama --version
            ollama list
            python/.venv/bin/python --version
            uv pip freeze --python python/.venv/bin/python
          } > output/ci-raw-exit/environment.txt 2>&1
          if [ -f python/uv.lock ]; then cp python/uv.lock output/ci-raw-exit/; fi
          for crash_log in python/hs_err_pid*.log; do
            if [ -f "$crash_log" ]; then cp "$crash_log" output/ci-raw-exit/; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-raw-exit-1.20-${{ matrix.sample }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/ci-raw-exit/
          retention-days: 7
          if-no-files-found: error
